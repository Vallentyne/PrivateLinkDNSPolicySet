name: Policy smoke test

on:
  workflow_dispatch:
    inputs:
      location:
        description: Azure region for disposable resources
        required: true
        default: canadacentral
        type: string
      keep_on_failure:
        description: Retain a failed environment for up to six hours
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dns-policy-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dns-policy-smoke
    env:
      LOCATION: ${{ inputs.location || 'canadacentral' }}
      RUN_ID: gha${{ github.run_id }}${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run smoke test
        shell: pwsh
        run: |
          $parameters = @{
            Action = 'All'
            SubscriptionId = '${{ vars.AZURE_SUBSCRIPTION_ID }}'
            ManagementGroupId = '${{ vars.AZURE_POLICY_MANAGEMENT_GROUP_ID }}'
            Location = $env:LOCATION
            RunId = $env:RUN_ID
          }
          if ('${{ inputs.keep_on_failure }}' -eq 'true') {
            $parameters.KeepOnFailure = $true
          }
          ./tests/smoke/Invoke-SmokeTest.ps1 @parameters

      - name: Ensure smoke environment is removed
        if: ${{ failure() && inputs.keep_on_failure != true }}
        shell: pwsh
        run: |
          ./tests/smoke/Invoke-SmokeTest.ps1 `
            -Action Destroy `
            -SubscriptionId '${{ vars.AZURE_SUBSCRIPTION_ID }}' `
            -ManagementGroupId '${{ vars.AZURE_POLICY_MANAGEMENT_GROUP_ID }}' `
            -RunId $env:RUN_ID

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-policy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/smoke/results/*.json
          if-no-files-found: warn
          retention-days: 30