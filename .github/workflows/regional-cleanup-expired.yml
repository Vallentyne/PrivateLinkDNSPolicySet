name: Cleanup expired regional smoke tests

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dns-regional-policy-smoke
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dns-policy-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove expired and orphaned regional smoke resources
        shell: pwsh
        run: |
          ./regional-routing/tests/Remove-ExpiredRegionalSmokeTests.ps1 `
            -SubscriptionId '${{ vars.AZURE_SUBSCRIPTION_ID }}' `
            -ManagementGroupId '${{ vars.AZURE_POLICY_MANAGEMENT_GROUP_ID }}'
